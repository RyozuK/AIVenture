[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiventure"
version = "0.1.0"
description = "A MUD-like text adventure game procedurally generated by a language model"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
web = [
    "websockets>=12.0",
]
discord = [
    "discord.py>=2.3.0",
]

[project.scripts]
aiventure = "aiventure.main:main"

[tool.setuptools.packages.find]
include = ["aiventure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]